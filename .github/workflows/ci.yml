name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.2
      - run: ruff check backend/
      - run: ruff format --check backend/

  types:
    name: Type Check (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mypy backend/app backend/tests

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest backend/tests/unit -v

  test-integration-sqlite:
    name: Integration Tests (sqlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest backend/tests/integration -v

  test-integration-postgresql:
    name: Integration Tests (postgresql)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: orqion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,postgres]" && pip install psycopg2-binary==2.9.10
      - run: echo "ORQION_DATABASE_URL=postgresql://postgres:test@localhost:5432/orqion_test" >> $GITHUB_ENV
      - run: pytest backend/tests/integration -v

  minimal:
    name: Minimal Profile Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package (no extras, no Docker, no external DB)
        run: pip install -e .
      - name: Run migrations
        run: orqion migrate
      - name: Start server in background
        run: |
          orqion serve --host 127.0.0.1 --port 8765 &
      - name: Health check (poll up to 15s)
        run: |
          for i in $(seq 1 15); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8765/health 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "OK: /health returned 200 (attempt $i)"
              exit 0
            fi
            sleep 1
          done
          echo "FAIL: /health did not return 200 after 15 attempts"
          exit 1
      - name: Verify no Docker required
        run: |
          if command -v docker &> /dev/null; then
            echo "Docker is present on runner but must not be required"
          fi
          echo "Minimal profile works without Docker"

  licenses:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,s3,metrics,oidc]"
      - name: Check all dependencies are permissively licensed
        run: |
          python -c "
          import json, subprocess, sys
          sys.path.insert(0, 'backend/scripts')
          BANNED = {'GPL', 'GPLv2', 'GPLv3', 'GPL-2.0', 'GPL-3.0', 'AGPL', 'AGPL-3.0', 'SSPL', 'BUSL', 'Sustainable Use License'}
          # Packages with dual-license where one option is LGPL.
          # LGPL is NOT opened as a category — only these specific packages are allowed
          # under their permissive alternative license.
          LGPL_DUAL_LICENSE = {'psycopg2-binary'}  # dual-licensed LGPL-3.0 OR Python-2.0
          # Packages with permissive licenses that pip-licenses cannot classify
          # (PEP 639 License-Expression, not in trove classifiers or metadata).
          # Each entry manually verified — see backend/scripts/license_allowlist.py
          # for license, source URL, and verification date.
          # When adding a new dependency with UNKNOWN license: add it to license_allowlist.py
          # with verification source, then add the name here.
          from license_allowlist import ALLOWED_UNKNOWN_VERIFIED
          ALLOWED_UNKNOWN = set(ALLOWED_UNKNOWN_VERIFIED.keys())
          result = subprocess.run(
              [sys.executable, '-m', 'piplicenses', '--from', 'mixed', '--format', 'json', '--with-system'],
              capture_output=True, text=True
          )
          if result.returncode != 0:
              print('pip-licenses failed:', result.stderr)
              sys.exit(1)
          packages = json.loads(result.stdout)
          violations = []
          unknown = []
          for pkg in packages:
              name = pkg.get('Name', '').lower()
              if name == 'orqion':
                  continue
              license_str = pkg.get('License', '') or ''
              if license_str in ('UNKNOWN', '', 'None'):
                  if name not in ALLOWED_UNKNOWN:
                      unknown.append(name)
                  continue
              # Dual-licensed packages with LGPL: allowed under permissive alternative
              if name in LGPL_DUAL_LICENSE and 'lgpl' in license_str.lower():
                  continue
              for banned in BANNED:
                  if banned.lower() in license_str.lower():
                      violations.append(f'{name}: {license_str}')
                      break
          if unknown:
              print('PACKAGES WITH UNKNOWN LICENSE (add to license_allowlist.py with verification):')
              for u in unknown:
                  print(f'  - {u}')
              sys.exit(1)
          if violations:
              print('BANNED LICENSES FOUND:')
              for v in violations:
                  print(f'  - {v}')
              sys.exit(1)
          print(f'All {len(packages)} packages passed license check')
          "

  frontend:
    name: Frontend (tsc + vitest + types sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend (for OpenAPI export)
        run: pip install -e .
      - working-directory: frontend
        run: npm ci
      - name: Export OpenAPI schema
        run: python backend/scripts/export_openapi.py
      - name: Regenerate TypeScript types
        working-directory: frontend
        run: npm run gen:types
      - name: Check types are in sync
        run: |
          git diff --exit-code frontend/openapi.json frontend/src/api/generated.ts || {
            echo "ERROR: OpenAPI types are out of sync."
            echo "Run: python backend/scripts/export_openapi.py && (cd frontend && npm run gen:types)"
            exit 1
          }
      - working-directory: frontend
        run: npx tsc --noEmit
      - working-directory: frontend
        run: npx vitest run
      - working-directory: frontend
        run: npm run build

  eval-gate:
    name: Eval Quality Gate (full ML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Кеш pip-зависимостей (torch ~2 ГБ) — скачивается один раз
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-full-${{ hashFiles('pyproject.toml') }}

      # Кеш весов моделей (bge-m3, bge-reranker-v2-m3)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-bge-m3-reranker-v2

      - name: Install orqion[full] — real ML models for quality gate
        run: pip install -e ".[full,dev]"
        # Явный fail при недоступности [full] — не тихая деградация.
        # Этот job УМЫШЛЕННО тяжёлый: единственная задача — реальное измерение
        # качества поиска (recall@k, MRR). Не оптимизировать на лёгкий вариант.

      - name: Run eval gate (real embeddings + reranker)
        env:
          ORQION_EVAL_GATE: "1"
        run: pytest backend/tests/eval -v --timeout=300

  oidc-gate:
    name: OIDC Security Gate (authlib extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install orqion[oidc] — real authlib for JWT validation
        run: pip install -e ".[oidc,dev]"
      - name: Run adversarial JWT tests (real authlib validation)
        run: pytest backend/tests/integration/test_oidc_adversarial.py -v
      - name: Run OIDC provider tests
        run: pytest backend/tests/integration/test_oidc_provider.py -v

  metrics-gate:
    name: Metrics Gate (prometheus-client extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install orqion[metrics] — real prometheus-client
        run: pip install -e ".[metrics,dev]"
      - name: Run metrics tests
        run: pytest backend/tests/integration/test_metrics.py -v
