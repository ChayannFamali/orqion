[build-system]
requires = ["setuptools==84.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orqion"
version = "0.1.0"
description = "Open-source LLM application: chat, provider routing, RAG, role-based access control"
requires-python = ">=3.12"
license = {text = "BUSL-1.1"}

dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.37.0",
    "sqlalchemy==2.0.51",
    "alembic==1.19.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "argon2-cffi==25.1.0",
    "tiktoken==0.13.0",
    "sqlite-vec==0.1.9",
    "aiosqlite==0.21.0",
    "cryptography==50.0.0",
    "anyio==4.14.2",
    "python-multipart==0.0.20",
    "docling-slim[format-pdf,format-office,feat-chunking,convert-core]==2.119.0",
    "tree-sitter==0.26.0",
    "tree-sitter-python==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-cpp==0.23.4",
    "tree-sitter-go==0.25.0",
    "tree-sitter-java==0.23.5",
    "tree-sitter-sql==0.3.11",
    "dulwich==1.2.12",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
full = [
    "FlagEmbedding==1.4.0",
]
graph = [
    "numpy==2.5.2",
]
vector-qdrant = [
    "qdrant-client==1.19.0",
]
postgres = [
    "asyncpg==0.30.0",
]
s3 = [
    "aioboto3==13.1.0",
]
oidc = [
    "authlib==1.7.2",
]
metrics = [
    "prometheus-client==0.22.1",
]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-timeout==2.3.1",
    "ruff==0.16.2",
    "mypy==2.3.0",
    "moto[server]==5.1.4",
    "reportlab==5.0.0",
    "pip-licenses==5.0.0",
]

[project.scripts]
orqion = "app.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["backend/app/db/migrations"]

[tool.ruff.lint]

[tool.ruff.lint.per-file-ignores]
"backend/app/api/**" = ["B008"]  # Depends() in default args — идиоматичный FastAPI
"backend/app/auth/dependencies.py" = ["B008"]
"backend/app/providers/model_download.py" = ["B008"]  # T-437: API-роуты в доменном модуле

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "backend"
files = ["backend/app", "backend/tests"]
exclude = ["backend/app/db/migrations/"]

[[tool.mypy.overrides]]
module = "tiktoken"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aioboto3"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "moto.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "reportlab.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pypdfium2"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "docling.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "docling_core.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "docling_ibm_models"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openpyxl"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sqlite_vec"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pptx"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tree_sitter_python"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tree_sitter_typescript"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tree_sitter_cpp"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tree_sitter_go"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tree_sitter_java"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tree_sitter_sql"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "dulwich.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "qdrant_client.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "prometheus_client.*"
ignore_missing_imports = true

# Опциональная зависимость (экстра orqion[graph], Т-505); с установленным
# numpy mypy берёт его собственные типы, оверрайд действует только без него.
[[tool.mypy.overrides]]
module = "numpy"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
timeout = 60
